<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="50%" stop-color="#23262b"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2d3038" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#3a3d45" opacity="0.4"/>
    </pattern>
    <linearGradient id="industrial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ff6b1a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#industrial)"/>
  <!-- Subtle diagonal accent lines — no text, pure industrial aesthetic -->
  <line x1="0" y1="400" x2="1600" y2="400" stroke="#ff6b1a" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#ff6b1a" stroke-width="1" opacity="0.04"/>
</svg>