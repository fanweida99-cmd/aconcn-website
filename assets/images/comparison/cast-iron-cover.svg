<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#23262b"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3d45"/>
      <stop offset="100%" stop-color="#2a2d33"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Cover frame - heavier look -->
  <rect x="90" y="50" width="220" height="180" rx="8" fill="url(#cover)" stroke="#555" stroke-width="2"/>
  <!-- Rust spots -->
  <circle cx="130" cy="90" r="8" fill="url(#rust)" opacity="0.6"/>
  <circle cx="280" cy="110" r="6" fill="url(#rust)" opacity="0.5"/>
  <circle cx="150" cy="180" r="5" fill="url(#rust)" opacity="0.4"/>
  <circle cx="260" cy="170" r="7" fill="url(#rust)" opacity="0.5"/>
  <!-- Inner grid pattern -->
  <rect x="105" y="65" width="190" height="150" rx="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="200" y1="65" x2="200" y2="215" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="140" x2="295" y2="140" stroke="#555" stroke-width="1"/>
  <!-- Heavy handle -->
  <rect x="160" y="200" width="80" height="12" rx="4" fill="#555"/>
  <!-- Weight label -->
  <text x="200" y="250" text-anchor="middle" fill="#888" font-family="Arial" font-size="14" font-weight="bold">~120 kg</text>
  <text x="200" y="270" text-anchor="middle" fill="#666" font-family="Arial" font-size="11">3x Heavier | Rusts Over Time</text>
</svg>