<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains">
    <title>Contact - ACONCN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #22d3ee; --dark: #0f172a; --light: #f8fafc; --gray: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; }
        nav { background: rgba(15,23,42,0.95); backdrop-filter: blur(10px); padding: 15px 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: var(--primary); font-size: 1.5rem; font-weight: 700; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        
        .hero { background: linear-gradient(135deg, var(--dark) 0%, #1e293b 100%); color: white; padding: 60px 0; text-align: center; }
        .hero h1 { font-size: 3rem; margin-bottom: 10px; }
        .hero p { color: #94a3b8; font-size: 1.2rem; }
        
        .container { max-width: 600px; margin: -60px auto 60px; padding: 0 20px; position: relative; z-index: 10; }
        .form-card { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); padding: 50px; }
        .form-card h2 { font-size: 1.8rem; color: var(--dark); margin-bottom: 8px; }
        .form-card p { color: var(--gray); margin-bottom: 35px; }
        
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: #334155; font-size: 0.95rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px 20px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; transition: all 0.3s; background: #fafafa; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(34,211,238,0.1); }
        .form-group textarea { resize: vertical; min-height: 150px; }
        
        .submit-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary) 0%, #06b6d4 100%); color: var(--dark); border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(34,211,238,0.3); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .message { padding: 20px; border-radius: 12px; margin-bottom: 25px; font-weight: 500; display: none; }
        .message.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        footer { background: var(--dark); color: #64748b; text-align: center; padding: 40px 0; }
        .footer-links { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; list-style: none; }
        .footer-links a { color: #64748b; text-decoration: none; }
        .footer-links a:hover { color: var(--primary); }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .form-card { padding: 30px; }
            .nav-links { gap: 15px; }
        }
    </style>
    <script>
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
            window.location.href = 'https://' + window.location.host + window.location.pathname + window.location.search;
        }
    </script>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">ACONCN</div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products.html">Products</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/contact-form-new.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="hero">
        <h1>Get In Touch</h1>
        <p>We're here to help with your infrastructure needs</p>
    </div>

    <div class="container">
        <div class="form-card">
            <h2>Contact Us</h2>
            <p>Send us a message and we'll get back to you within 24 hours.</p>
            <div id="message" class="message"></div>
            
            <form id="contactForm">
                <input type="hidden" name="access_key" value="a4a65bc2-9a7e-40af-a998-5cf219a4ddff">
                
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" name="name" placeholder="Your full name" required>
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone" placeholder="+86 xxx xxxx xxxx">
                </div>
                
                <div class="form-group">
                    <label>Message *</label>
                    <textarea name="message" placeholder="Tell us about your project requirements..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <ul class="footer-links">
            <li><a href="/">Home</a></li>
            <li><a href="/products.html">Products</a></li>
            <li><a href="/about.html">About</a></li>
            <li><a href="/contact-form-new.html">Contact</a></li>
        </ul>
        <p>&copy; 2024 ACONCN. All rights reserved.</p>
    </footer>

    <script>
        var form = document.getElementById('contactForm');
        var btn = document.getElementById('submitBtn');
        var msg = document.getElementById('message');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = '⏳ Sending...';
            msg.style.display = 'none';

            var formData = new FormData(form);
            var name = formData.get('name');
            var email = formData.get('email');
            var phone = formData.get('phone');
            var message = formData.get('message');

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                if (!response.ok) throw new Error('HTTP error');
                return response.json();
            })
            .then(function(data) {
                if (!data.success) throw new Error(data.message || 'Failed');
                
                fetch('https://nutgspxepoguoxdicjqh.supabase.co/rest/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51dGdzcHhlcG9ndW94ZGljanFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTkzMzE3MDMsImV4cCI6MjAzNDkwNzcwM30.Q0fN4v2P5Xz7y3t5W4V3d2U1s6b9c8a7m5n4b3v2c1x0w9q8e7r6t5y4u3i2o1p0o9i8u7y6t5r4e3w2q1a0s9d8f7g6h5j4k3l2m1n0b9v8c7x6z5a4s3d2f1g0h9j8k7l6m5n4b3v2c1x0w9q8e7r6t5y4u3i2o1p'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        phone: phone,
                        message: message,
                        created_at: new Date().toISOString()
                    })
                })
                .then(function(r) { return r.json(); })
                .catch(function() { /* Database save failure doesn't affect email sending */ });

                msg.className = 'message success';
                msg.textContent = 'Thank you! Your message has been sent successfully. We will contact you within 24 hours.';
                msg.style.display = 'block';
                form.reset();
            })
            .catch(function(error) {
                msg.className = 'message error';
                msg.textContent = 'Failed to send. Please try again.';
                msg.style.display = 'block';
                console.error(error);
            })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = 'Send Message';
            });
        });
    </script>
</body>
</html>
