<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ACONCN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .form-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { font-size: 2rem; margin-bottom: 8px; color: #0f172a; }
        p { color: #64748b; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; }
        input, textarea { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: #22d3ee; }
        textarea { resize: vertical; min-height: 120px; }
        button { width: 100%; padding: 15px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #06b6d4; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .message.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        nav { background: #0f172a; padding: 20px; margin-bottom: 40px; }
        nav .logo { color: #22d3ee; font-size: 1.5rem; font-weight: 700; }
        nav ul { list-style: none; display: flex; gap: 20px; margin-top: 10px; }
        nav a { color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <div class="container" style="max-width:1200px;">
            <div class="logo">ACONCN</div>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/products.html">Products</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/contact-form-new.html" style="color:#22d3ee;">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-box">
            <h1>Contact Us</h1>
            <p>Send us a message and we'll get back to you within 24 hours.</p>
            <div id="message" class="message"></div>
            <form id="contactForm">
                <input type="hidden" name="access_key" value="a4a65bc2-9a7e-40af-a998-5cf219a4ddff">
                <div class="form-group"><label>Name</label><input type="text" name="name" placeholder="Your name" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="your@email.com" required></div>
                <div class="form-group"><label>Phone</label><input type="tel" name="phone" placeholder="+86 xxx xxxx xxxx"></div>
                <div class="form-group"><label>Message</label><textarea name="message" placeholder="Tell us about your project..." required></textarea></div>
                <button type="submit" id="submitBtn">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = document.getElementById('submitBtn');
            var msg = document.getElementById('message');
            btn.disabled = true;
            btn.innerHTML = '⏳ Sending...';
            msg.style.display = 'none';
            
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: new FormData(this)
            }).then(function(r) {
                if (!r.ok) throw new Error('HTTP error');
                return r.json();
            }).then(function(data) {
                if (data.success) {
                    msg.className = 'message success';
                    msg.textContent = 'Thank you! Your message has been sent successfully.';
                    msg.style.display = 'block';
                    document.getElementById('contactForm').reset();
                } else {
                    throw new Error(data.message || 'Failed');
                }
            }).catch(function(err) {
                msg.className = 'message error';
                msg.textContent = 'Failed to send. Please try again.';
                msg.style.display = 'block';
            }).finally(function() {
                btn.disabled = false;
                btn.textContent = 'Send Message';
            });
        });
    </script>
</body>
</html>
