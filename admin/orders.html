<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACONCN Admin - Orders</title>
    <script>window.location.replace('index.html#orders');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="orders">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../assets/images/logo.png" alt="ACONCN" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-name">ACONCN <span>Admin</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">Main Menu</div>
                <div class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><i class="fas fa-chart-simple"></i></span>
                    <span data-lang="nav.dashboard">Dashboard</span>
                </div>
                <div class="nav-item" data-page="products">
                    <span class="nav-icon"><i class="fas fa-box"></i></span>
                    <span data-lang="nav.products">Products</span>
                </div>
                <div class="nav-item active" data-page="orders">
                    <span class="nav-icon"><i class="fas fa-shopping-cart"></i></span>
                    <span data-lang="nav.orders">Orders</span>
                </div>
                <div class="nav-item" data-page="customers">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span data-lang="nav.customers">Customers</span>
                </div>
                <div class="nav-section">Content</div>
                <div class="nav-item" data-page="certifications">
                    <span class="nav-icon"><i class="fas fa-certificate"></i></span>
                    <span data-lang="nav.certifications">Certifications</span>
                </div>
                <div class="nav-item" data-page="news">
                    <span class="nav-icon"><i class="fas fa-newspaper"></i></span>
                    <span data-lang="nav.news">News</span>
                </div>
                <div class="nav-item" data-page="comparisons">
                    <span class="nav-icon"><i class="fas fa-balance-scale"></i></span>
                    <span data-lang="nav.comparisons">Comparisons</span>
                </div>
                <div class="nav-item" data-page="messages">
                    <span class="nav-icon"><i class="fas fa-envelope"></i></span>
                    <span data-lang="nav.messages">Messages</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle" style="font-size:2.2rem;color:var(--text-muted);"></i>
                    </div>
                    <div>
                        <div class="user-name" id="header-username">Admin</div>
                        <div class="user-role" data-lang="header.welcome">Welcome</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title" id="page-title" data-lang="orders.title">Orders Management</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-sm btn-ghost" id="lang-switch" data-lang="header.langSwitch">中文</button>
                    <button class="btn btn-sm btn-danger" id="logout-btn" data-lang="header.logout">Logout</button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="page-content" data-page="orders">
                <div class="table-container">
                    <div class="table-header">
                        <h3 data-lang="orders.title">Orders Management</h3>
                        <div class="table-actions">
                            <div class="search-bar">
                                <div class="search-input-wrap">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" placeholder="Search orders by customer, product, or ID..." id="search-input" data-lang="orders.search" oninput="debounceSearch('searchOrders', this.value)">
                                </div>
                            </div>
                            <button class="btn btn-sm btn-primary" onclick="openAddOrderModal()">
                                <i class="fas fa-plus"></i> <span data-lang="orders.add">Add Order</span>
                            </button>
                            <button class="btn btn-sm btn-ghost" onclick="renderOrdersPage()" title="Refresh">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th data-lang="orders.id">Order ID</th>
                                    <th data-lang="orders.customer">Customer</th>
                                    <th data-lang="orders.product">Product</th>
                                    <th data-lang="orders.quantity">Quantity</th>
                                    <th data-lang="orders.amount">Amount ($)</th>
                                    <th data-lang="orders.status">Status</th>
                                    <th data-lang="orders.date">Date</th>
                                    <th data-lang="orders.actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="8" class="text-center text-muted" data-lang="common.loading">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Modal -->
    <div class="modal-overlay" id="order-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="order-modal-title" data-lang="orders.addEdit">Add/Edit Order</h3>
                <button class="modal-close" onclick="closeModal('order-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="order-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="order-customer" data-lang="orders.customer">Customer</label>
                        <input type="text" class="form-control" id="order-customer" placeholder="Enter customer name" data-lang="orders.placeholderCustomer">
                    </div>
                    <div class="form-group">
                        <label for="order-product" data-lang="orders.product">Product</label>
                        <input type="text" class="form-control" id="order-product" placeholder="Enter product name" data-lang="orders.placeholderProduct">
                    </div>
                </div>
                <div class="form-row cols-3">
                    <div class="form-group">
                        <label for="order-quantity" data-lang="orders.quantity">Quantity</label>
                        <input type="number" class="form-control" id="order-quantity" min="1" placeholder="Enter quantity" data-lang="orders.placeholderQuantity">
                    </div>
                    <div class="form-group">
                        <label for="order-amount" data-lang="orders.amount">Amount ($)</label>
                        <input type="number" class="form-control" id="order-amount" step="0.01" min="0" placeholder="Enter amount" data-lang="orders.placeholderAmount">
                    </div>
                    <div class="form-group">
                        <label for="order-status" data-lang="orders.status">Status</label>
                        <select class="form-control" id="order-status">
                            <option value="pending" data-lang="orders.pending">Pending</option>
                            <option value="processing" data-lang="orders.processing">Processing</option>
                            <option value="completed" data-lang="orders.completed">Completed</option>
                            <option value="cancelled" data-lang="orders.cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="order-date" data-lang="orders.date">Date</label>
                    <input type="date" class="form-control" id="order-date">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('order-modal')" data-lang="orders.cancel">Cancel</button>
                <button class="btn btn-primary" onclick="saveOrder()" data-lang="orders.save">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=1" defer></script>
</body>
</html>
