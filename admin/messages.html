<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACONCN Admin - Messages</title>
    <script>window.location.replace('index.html#messages');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="messages">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../assets/images/logo.png" alt="ACONCN" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-name">ACONCN <span>Admin</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">Main Menu</div>
                <div class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><i class="fas fa-chart-simple"></i></span>
                    <span data-lang="nav.dashboard">Dashboard</span>
                </div>
                <div class="nav-item" data-page="products">
                    <span class="nav-icon"><i class="fas fa-box"></i></span>
                    <span data-lang="nav.products">Products</span>
                </div>
                <div class="nav-item" data-page="orders">
                    <span class="nav-icon"><i class="fas fa-shopping-cart"></i></span>
                    <span data-lang="nav.orders">Orders</span>
                </div>
                <div class="nav-item" data-page="customers">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span data-lang="nav.customers">Customers</span>
                </div>
                <div class="nav-section">Content</div>
                <div class="nav-item" data-page="certifications">
                    <span class="nav-icon"><i class="fas fa-certificate"></i></span>
                    <span data-lang="nav.certifications">Certifications</span>
                </div>
                <div class="nav-item" data-page="news">
                    <span class="nav-icon"><i class="fas fa-newspaper"></i></span>
                    <span data-lang="nav.news">News</span>
                </div>
                <div class="nav-item" data-page="comparisons">
                    <span class="nav-icon"><i class="fas fa-balance-scale"></i></span>
                    <span data-lang="nav.comparisons">Comparisons</span>
                </div>
                <div class="nav-item active" data-page="messages">
                    <span class="nav-icon"><i class="fas fa-envelope"></i></span>
                    <span data-lang="nav.messages">Messages</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle" style="font-size:2.2rem;color:var(--text-muted);"></i>
                    </div>
                    <div>
                        <div class="user-name" id="header-username">Admin</div>
                        <div class="user-role" data-lang="header.welcome">Welcome</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title" id="page-title" data-lang="messages.title">Messages Management</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-sm btn-ghost" id="lang-switch" data-lang="header.langSwitch">中文</button>
                    <button class="btn btn-sm btn-danger" id="logout-btn" data-lang="header.logout">Logout</button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="page-content" data-page="messages">
                <div class="table-container">
                    <div class="table-header">
                        <h3 data-lang="messages.title">Messages Management</h3>
                        <div class="table-actions">
                            <div class="search-bar">
                                <div class="search-input-wrap">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" placeholder="Search messages by name, email, or content..." id="search-input" data-lang="messages.search" oninput="debounceSearch('searchMessages', this.value)">
                                </div>
                            </div>
                            <button class="btn btn-sm btn-primary" onclick="refreshMessages()">
                                <i class="fas fa-sync-alt"></i> <span data-lang="messages.refresh">Refresh</span>
                            </button>
                            <button class="btn btn-sm btn-ghost" onclick="renderMessagesPage()" title="Refresh">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th data-lang="messages.id">ID</th>
                                    <th data-lang="messages.name">Name</th>
                                    <th data-lang="messages.email">Email</th>
                                    <th data-lang="messages.phone">Phone</th>
                                    <th data-lang="messages.message">Message</th>
                                    <th data-lang="messages.status">Status</th>
                                    <th data-lang="messages.date">Date</th>
                                    <th data-lang="messages.actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="8" class="text-center text-muted" data-lang="common.loading">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Message View Modal -->
    <div class="modal-overlay" id="message-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 data-lang="messages.viewMessage">View Message</h3>
                <button class="modal-close" onclick="closeModal('message-modal')">&times;</button>
            </div>
            <div class="modal-body" id="message-modal-body">
                <div class="form-group">
                    <label data-lang="messages.name">Name</label>
                    <p id="msg-view-name" class="text-primary" style="color:var(--text-primary);font-size:1rem;"></p>
                </div>
                <div class="form-group">
                    <label data-lang="messages.email">Email</label>
                    <p id="msg-view-email" style="color:var(--text-primary);"></p>
                </div>
                <div class="form-group">
                    <label data-lang="messages.phone">Phone</label>
                    <p id="msg-view-phone" style="color:var(--text-primary);"></p>
                </div>
                <div class="form-group">
                    <label data-lang="messages.message">Message</label>
                    <div id="msg-view-content" style="background:var(--bg-input);padding:12px;border-radius:var(--radius);color:var(--text-primary);line-height:1.7;white-space:pre-wrap;"></div>
                </div>
                <div class="form-group">
                    <label data-lang="messages.date">Date</label>
                    <p id="msg-view-date" style="color:var(--text-primary);"></p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('message-modal')" data-lang="messages.close">Close</button>
                <button class="btn btn-primary" id="msg-mark-read-btn" onclick="markMessageRead()" data-lang="messages.markRead">Mark as Read</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=1" defer></script>
</body>
</html>
