<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACONCN Admin - Login</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img src="../assets/images/logo.png" alt="ACONCN Logo">
            </div>
            <h2 data-lang="login.title">Admin Login</h2>
            <div id="error-message" class="error-message" data-lang="login.error">Invalid username or password. Please try again.</div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> <span data-lang="login.username">Username</span></label>
                    <input type="text" id="username" data-lang="login.placeholderUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> <span data-lang="login.password">Password</span></label>
                    <input type="password" id="password" data-lang="login.placeholderPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login" data-lang="login.signIn">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 20px; color: #94A3B8; font-size: 0.85rem;" data-lang="login.default">
                Default: admin / admin123
            </p>
            <div style="text-align: center; margin-top: 15px;">
                <button onclick="switchLang('en')" style="padding: 5px 15px; margin-right: 5px; border: 1px solid #E2E8F0; border-radius: 4px; cursor: pointer; background: #FFFFFF; color: #0F172A;">EN</button>
                <button onclick="switchLang('zh')" style="padding: 5px 15px; border: 1px solid #E2E8F0; border-radius: 4px; cursor: pointer; background: #FFFFFF; color: #0F172A;">中文</button>
            </div>
        </div>
    </div>
    <script src="assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateLanguage();
        });
    </script>
</body>
</html>
