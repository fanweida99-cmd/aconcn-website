<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACONCN Admin - Customers</title>
    <script>window.location.replace('index.html#customers');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="customers">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../assets/images/logo.png" alt="ACONCN" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-name">ACONCN <span>Admin</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">Main Menu</div>
                <div class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><i class="fas fa-chart-simple"></i></span>
                    <span data-lang="nav.dashboard">Dashboard</span>
                </div>
                <div class="nav-item" data-page="products">
                    <span class="nav-icon"><i class="fas fa-box"></i></span>
                    <span data-lang="nav.products">Products</span>
                </div>
                <div class="nav-item" data-page="orders">
                    <span class="nav-icon"><i class="fas fa-shopping-cart"></i></span>
                    <span data-lang="nav.orders">Orders</span>
                </div>
                <div class="nav-item active" data-page="customers">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span data-lang="nav.customers">Customers</span>
                </div>
                <div class="nav-section">Content</div>
                <div class="nav-item" data-page="certifications">
                    <span class="nav-icon"><i class="fas fa-certificate"></i></span>
                    <span data-lang="nav.certifications">Certifications</span>
                </div>
                <div class="nav-item" data-page="news">
                    <span class="nav-icon"><i class="fas fa-newspaper"></i></span>
                    <span data-lang="nav.news">News</span>
                </div>
                <div class="nav-item" data-page="comparisons">
                    <span class="nav-icon"><i class="fas fa-balance-scale"></i></span>
                    <span data-lang="nav.comparisons">Comparisons</span>
                </div>
                <div class="nav-item" data-page="messages">
                    <span class="nav-icon"><i class="fas fa-envelope"></i></span>
                    <span data-lang="nav.messages">Messages</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle" style="font-size:2.2rem;color:var(--text-muted);"></i>
                    </div>
                    <div>
                        <div class="user-name" id="header-username">Admin</div>
                        <div class="user-role" data-lang="header.welcome">Welcome</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title" id="page-title" data-lang="customers.title">Customers Management</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-sm btn-ghost" id="lang-switch" data-lang="header.langSwitch">中文</button>
                    <button class="btn btn-sm btn-danger" id="logout-btn" data-lang="header.logout">Logout</button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="page-content" data-page="customers">
                <div class="table-container">
                    <div class="table-header">
                        <h3 data-lang="customers.title">Customers Management</h3>
                        <div class="table-actions">
                            <div class="search-bar">
                                <div class="search-input-wrap">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" placeholder="Search customers by name, company, or country..." id="search-input" data-lang="customers.search" oninput="debounceSearch('searchCustomers', this.value)">
                                </div>
                            </div>
                            <button class="btn btn-sm btn-primary" onclick="openAddCustomerModal()">
                                <i class="fas fa-plus"></i> <span data-lang="customers.add">Add Customer</span>
                            </button>
                            <button class="btn btn-sm btn-ghost" onclick="renderCustomersPage()" title="Refresh">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th data-lang="customers.id">ID</th>
                                    <th data-lang="customers.name">Name</th>
                                    <th data-lang="customers.company">Company</th>
                                    <th data-lang="customers.email">Email</th>
                                    <th data-lang="customers.phone">Phone</th>
                                    <th data-lang="customers.country">Country</th>
                                    <th data-lang="customers.status">Status</th>
                                    <th data-lang="customers.actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="8" class="text-center text-muted" data-lang="common.loading">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Customer Modal -->
    <div class="modal-overlay" id="customer-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="customer-modal-title" data-lang="customers.addEdit">Add/Edit Customer</h3>
                <button class="modal-close" onclick="closeModal('customer-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="customer-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="customer-name" data-lang="customers.name">Name</label>
                        <input type="text" class="form-control" id="customer-name" placeholder="Enter customer name" data-lang="customers.placeholderName">
                    </div>
                    <div class="form-group">
                        <label for="customer-company" data-lang="customers.company">Company</label>
                        <input type="text" class="form-control" id="customer-company" placeholder="Enter company name" data-lang="customers.placeholderCompany">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="customer-email" data-lang="customers.email">Email</label>
                        <input type="email" class="form-control" id="customer-email" placeholder="Enter email address" data-lang="customers.placeholderEmail">
                    </div>
                    <div class="form-group">
                        <label for="customer-phone" data-lang="customers.phone">Phone</label>
                        <input type="text" class="form-control" id="customer-phone" placeholder="Enter phone number" data-lang="customers.placeholderPhone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="customer-country" data-lang="customers.country">Country</label>
                        <input type="text" class="form-control" id="customer-country" placeholder="Enter country" data-lang="customers.placeholderCountry">
                    </div>
                    <div class="form-group">
                        <label for="customer-status" data-lang="customers.status">Status</label>
                        <select class="form-control" id="customer-status">
                            <option value="active" data-lang="customers.active">Active</option>
                            <option value="inactive" data-lang="customers.inactive">Inactive</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('customer-modal')" data-lang="customers.cancel">Cancel</button>
                <button class="btn btn-primary" onclick="saveCustomer()" data-lang="customers.save">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=1" defer></script>
</body>
</html>
