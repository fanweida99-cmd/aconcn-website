<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACONCN Admin - Customers</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/logo.png" alt="ACONCN Logo">
            </div>
            <nav>
                <ul class="sidebar-nav">
                    <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> <span data-lang="nav.dashboard">Dashboard</span></a></li>
                    <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> <span data-lang="nav.orders">Orders</span></a></li>
                    <li><a href="products.html"><i class="fas fa-box"></i> <span data-lang="nav.products">Products</span></a></li>
                    <li><a href="customers.html" class="active"><i class="fas fa-users"></i> <span data-lang="nav.customers">Customers</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <h1 data-lang="customers.title">Customers Management</h1>
                <div class="user-info">
                    <span data-lang="header.welcome">Welcome, Admin</span>
                    <button onclick="switchLang('en')" style="padding: 5px 12px; margin-right: 5px; border: 1px solid #E2E8F0; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">EN</button>
                    <button onclick="switchLang('zh')" style="padding: 5px 12px; margin-right: 10px; border: 1px solid #E2E8F0; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">中文</button>
                    <button id="logout-btn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> <span data-lang="header.logout">Logout</span></button>
                </div>
            </header>

            <!-- Customers Content -->
            <div class="dashboard-content">
                <!-- Search Bar -->
                <div class="search-bar">
                    <input type="text" id="search-customers" data-lang="customers.search" placeholder="Search customers by name, company, or country..." onkeyup="searchCustomers()">
                    <button class="btn-add" onclick="openModal('customer-modal')"><i class="fas fa-plus"></i> <span data-lang="customers.add">Add Customer</span></button>
                </div>

                <!-- Customers Table -->
                <div class="orders-table">
                    <table>
                        <thead>
                            <tr>
                                <th data-lang="customers.id">ID</th>
                                <th data-lang="customers.name">Name</th>
                                <th data-lang="customers.company">Company</th>
                                <th data-lang="customers.email">Email</th>
                                <th data-lang="customers.phone">Phone</th>
                                <th data-lang="customers.country">Country</th>
                                <th data-lang="customers.status">Status</th>
                                <th data-lang="customers.actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customers-table-body">
                        </tbody>
                    </table>
                    <div class="pagination">
                        <button class="active">1</button>
                        <button>2</button>
                        <button><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Customer Modal -->
    <div id="customer-modal" class="modal-overlay">
        <div class="modal">
            <h3 data-lang="customers.addEdit">Add/Edit Customer</h3>
            <form id="customer-form">
                <input type="hidden" id="customer-id">
                <div class="form-group">
                    <label for="customer-name" data-lang="customers.fullName">Full Name</label>
                    <input type="text" id="customer-name" placeholder="Enter customer name" required>
                </div>
                <div class="form-group">
                    <label for="customer-company" data-lang="customers.company">Company</label>
                    <input type="text" id="customer-company" placeholder="Enter company name" required>
                </div>
                <div class="form-group">
                    <label for="customer-email" data-lang="customers.email">Email</label>
                    <input type="email" id="customer-email" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label for="customer-phone" data-lang="customers.phone">Phone</label>
                    <input type="text" id="customer-phone" placeholder="Enter phone number" required>
                </div>
                <div class="form-group">
                    <label for="customer-country" data-lang="customers.country">Country</label>
                    <input type="text" id="customer-country" placeholder="Enter country" required>
                </div>
                <div class="form-group">
                    <label for="customer-status" data-lang="customers.status">Status</label>
                    <select id="customer-status">
                        <option value="active" data-lang="customers.active">Active</option>
                        <option value="inactive" data-lang="customers.inactive">Inactive</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal('customer-modal')" data-lang="orders.cancel">Cancel</button>
                    <button type="button" class="btn-save" onclick="saveCustomer()" data-lang="orders.save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            updateLanguage();
            renderCustomersTable(customersData);
        });
    </script>
</body>
</html>
