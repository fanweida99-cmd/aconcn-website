<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACONCN Admin - Products</title>
    <script>window.location.replace('index.html#products');</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="products">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-logo-text">ACONCN</span>
                <div class="brand-name">ACONCN <span>Admin</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">Main Menu</div>
                <div class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><i class="fas fa-chart-simple"></i></span>
                    <span data-lang="nav.dashboard">Dashboard</span>
                </div>
                <div class="nav-item active" data-page="products">
                    <span class="nav-icon"><i class="fas fa-box"></i></span>
                    <span data-lang="nav.products">Products</span>
                </div>
                <div class="nav-item" data-page="orders">
                    <span class="nav-icon"><i class="fas fa-shopping-cart"></i></span>
                    <span data-lang="nav.orders">Orders</span>
                </div>
                <div class="nav-item" data-page="customers">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span data-lang="nav.customers">Customers</span>
                </div>
                <div class="nav-section">Content</div>
                <div class="nav-item" data-page="certifications">
                    <span class="nav-icon"><i class="fas fa-certificate"></i></span>
                    <span data-lang="nav.certifications">Certifications</span>
                </div>
                <div class="nav-item" data-page="news">
                    <span class="nav-icon"><i class="fas fa-newspaper"></i></span>
                    <span data-lang="nav.news">News</span>
                </div>
                <div class="nav-item" data-page="comparisons">
                    <span class="nav-icon"><i class="fas fa-balance-scale"></i></span>
                    <span data-lang="nav.comparisons">Comparisons</span>
                </div>
                <div class="nav-item" data-page="messages">
                    <span class="nav-icon"><i class="fas fa-envelope"></i></span>
                    <span data-lang="nav.messages">Messages</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle" style="font-size:2.2rem;color:var(--text-muted);"></i>
                    </div>
                    <div>
                        <div class="user-name" id="header-username">Admin</div>
                        <div class="user-role" data-lang="header.welcome">Welcome</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title" id="page-title" data-lang="products.title">Products Management</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-sm btn-ghost" id="lang-switch" data-lang="header.langSwitch">中文</button>
                    <button class="btn btn-sm btn-danger" id="logout-btn" data-lang="header.logout">Logout</button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="page-content" data-page="products">
                <div class="table-container">
                    <div class="table-header">
                        <h3 data-lang="products.title">Products Management</h3>
                        <div class="table-actions">
                            <div class="search-bar">
                                <div class="search-input-wrap">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" placeholder="Search products by name, category, or load class..." id="search-input" data-lang="products.search" oninput="debounceSearch('searchProducts', this.value)">
                                </div>
                            </div>
                            <button class="btn btn-sm btn-primary" onclick="openAddProductModal()">
                                <i class="fas fa-plus"></i> <span data-lang="products.add">Add Product</span>
                            </button>
                            <button class="btn btn-sm btn-ghost" onclick="renderProductsPage()" title="Refresh">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th data-lang="products.id">ID</th>
                                    <th data-lang="products.image">Image</th>
                                    <th data-lang="products.name">Name</th>
                                    <th data-lang="products.category">Category</th>
                                    <th data-lang="products.loadClass">Load Class</th>
                                    <th data-lang="products.price">Price ($)</th>
                                    <th data-lang="products.stock">Stock</th>
                                    <th data-lang="products.status">Status</th>
                                    <th data-lang="products.actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="9" class="text-center text-muted" data-lang="common.loading">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 id="product-modal-title" data-lang="products.addEdit">Add/Edit Product</h3>
                <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="product-id">
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-name" data-lang="products.productName">Product Name</label>
                            <input type="text" class="form-control" id="product-name" placeholder="Enter product name" data-lang="products.placeholderName">
                        </div>
                        <div class="form-group">
                            <label for="product-category" data-lang="products.category">Category</label>
                            <select class="form-control" id="product-category">
                                <option value="Manhole Covers">Manhole Covers</option>
                                <option value="Outdoor Products">Outdoor Products</option>
                                <option value="Conveyor Rollers">Conveyor Rollers</option>
                                <option value="Pipe Repair">Pipe Repair</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row cols-3">
                        <div class="form-group">
                            <label for="product-loadclass" data-lang="products.loadClass">Load Class</label>
                            <input type="text" class="form-control" id="product-loadclass" placeholder="e.g. D400, E600" data-lang="products.placeholderLoadClass">
                        </div>
                        <div class="form-group">
                            <label for="product-price" data-lang="products.price">Price ($)</label>
                            <input type="number" class="form-control" id="product-price" step="0.01" min="0" placeholder="Enter price" data-lang="products.placeholderPrice">
                        </div>
                        <div class="form-group">
                            <label for="product-stock" data-lang="products.stock">Stock</label>
                            <input type="number" class="form-control" id="product-stock" min="0" placeholder="Enter stock quantity" data-lang="products.placeholderStock">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="product-description" data-lang="products.description">Description</label>
                        <textarea class="form-control" id="product-description" rows="3" placeholder="Enter product description" data-lang="products.placeholderDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label data-lang="products.image">Image</label>
                        <input type="hidden" id="product-image">
                        <div style="display:flex;gap:12px;align-items:center;">
                            <input type="file" id="product-image-upload" accept="image/*" style="display:none;">
                            <button class="btn btn-sm btn-secondary upload-btn" onclick="document.getElementById('product-image-upload').click()">
                                <i class="fas fa-upload"></i> <span data-lang="products.uploadImage">Upload Image</span>
                            </button>
                            <input type="text" class="form-control" id="product-image-url" placeholder="Image URL or upload" data-lang="products.placeholderImage" style="flex:1;" oninput="document.getElementById('product-image').value=this.value">
                        </div>
                        <img id="product-image-preview" class="img-thumb img-thumb-lg" style="display:none;margin-top:8px;" onclick="this.style.display='none'">
                    </div>
                    <div class="form-group">
                        <label for="product-status" data-lang="products.status">Status</label>
                        <select class="form-control" id="product-status">
                            <option value="active" data-lang="products.active">Active</option>
                            <option value="inactive" data-lang="products.inactive">Inactive</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('product-modal')" data-lang="products.cancel">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()" data-lang="products.save">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/admin.js?v=2" defer></script>
</body>
</html>
